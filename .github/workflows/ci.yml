name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: make check
      - run: make smoke
      - run: docker build -t benyan-fastapi-starter:ci .
      - run: docker run --rm benyan-fastapi-starter:ci alembic --help
